<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator Stack</title>
<meta name="description" content="Directory of tools for video editors and content creators.">
<!-- Favicon SVG (même style que le logo du header) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Cdefs%3E%3ClinearGradient%20id=%27g%27%20x1=%270%27%20y1=%270%27%20x2=%271%27%20y2=%271%27%3E%3Cstop%20offset=%270%27%20stop-color=%27%23a78bfa%27/%3E%3Cstop%20offset=%271%27%20stop-color=%27%2367e8f9%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%279%27%20fill=%27url(%23g)%27/%3E%3Ctext%20x=%2716%27%20y=%2716.5%27%20text-anchor=%27middle%27%20dominant-baseline=%27central%27%20font-family=%27Sora,system-ui,-apple-system,Segoe%20UI,Arial,sans-serif%27%20font-size=%2714%27%20font-weight=%27700%27%20fill=%27%23050505%27%3ECS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Tailwind via CDN : aucun build requis (pour la production, préférer un build Tailwind) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Sora','ui-sans-serif','system-ui','sans-serif']}}}};</script>
<style>
  /* Fond #050505 + lueurs d'ambiance très subtiles */
  body{background-color:#050505;background-attachment:fixed;
    background-image:radial-gradient(60rem 40rem at 15% -10%,rgba(76,61,190,.16),transparent 60%),
    radial-gradient(50rem 35rem at 95% 10%,rgba(14,116,144,.12),transparent 60%),
    radial-gradient(45rem 30rem at 50% 110%,rgba(131,24,67,.10),transparent 60%)}
  .glass{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);
    -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
  /* Scroll reveal + survol des cartes */
  .card{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s,background-color .35s}
  .card.is-visible{opacity:1;transform:none}
  .card.is-visible:hover{transform:translateY(-6px);border-color:rgba(167,139,250,.45);background:rgba(255,255,255,.055);box-shadow:0 18px 50px -18px rgba(124,92,255,.35)}
  .chip{transition:all .25s}.chip[aria-pressed="true"]{background:#fff;color:#050505;border-color:#fff}
  .lang button{transition:color .2s}.lang button[aria-pressed="true"]{color:#fff}
  /* Modale : fondu + léger zoom */
  #modal{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility 0s .3s}
  #modal.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .3s ease}
  #panel{transform:translateY(16px) scale(.97);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
  #modal.open #panel{transform:none}
  .field{width:100%;border-radius:.75rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);padding:.7rem .9rem;font-size:.875rem;color:#fff;transition:border-color .2s,background .2s}
  .field:focus{outline:none;border-color:rgba(167,139,250,.6);background:rgba(255,255,255,.08)}
  select.field option{background:#111;color:#fff}
  .card.hidden{display:none}
  .featured{border-color:rgba(251,191,36,.4)!important;box-shadow:0 0 0 1px rgba(251,191,36,.12) inset,0 0 44px -14px rgba(251,191,36,.35)}
  .plan input{position:absolute;opacity:0}
  .plan div{border:1px solid rgba(255,255,255,.1);border-radius:.75rem;padding:.6rem .8rem;transition:all .2s;cursor:pointer}
  .plan input:checked+div{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.08)}
  .plan input:focus-visible+div{outline:2px solid #a78bfa}
  .toast{opacity:0;transform:translate(-50%,12px);transition:all .3s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  :focus-visible{outline:2px solid #a78bfa;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){.card{transition:none;opacity:1;transform:none}#modal,#panel{transition:none}}
</style>
</head>
<body class="font-sans text-zinc-200 antialiased min-h-screen">

<!-- ============ HEADER FIXE ============ -->
<header class="sticky top-0 z-40 glass border-x-0 border-t-0">
  <div class="mx-auto max-w-7xl px-5 py-3 flex flex-wrap items-center gap-x-4 gap-y-3 sm:gap-x-6">
    <a href="#" class="flex items-center gap-2 shrink-0" aria-label="Creator Stack">
      <span class="h-7 w-7 rounded-lg bg-gradient-to-br from-violet-400 to-cyan-300 grid place-items-center text-[#050505] text-xs font-bold">CS</span>
      <span class="font-semibold tracking-tight text-white">Creator Stack</span>
    </a>
    <!-- Recherche globale (order-last : passe sous le logo sur mobile) -->
    <label class="relative order-last w-full sm:order-none sm:w-auto sm:flex-1 sm:max-w-xl sm:mx-auto">
      <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-4 w-4 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" autocomplete="off" data-ph="search" class="w-full rounded-full bg-white/5 border border-white/10 pl-11 pr-16 py-2.5 text-sm placeholder-zinc-500 focus:bg-white/[.08] focus:border-violet-400/50 focus:outline-none transition">
      <kbd id="kbd" class="hidden sm:block absolute right-4 top-1/2 -translate-y-1/2 text-[11px] text-zinc-500 border border-white/10 rounded px-1.5 py-0.5">Ctrl K</kbd>
    </label>
    <!-- Sélecteur de langue FR | EN -->
    <div class="lang ml-auto sm:ml-0 flex items-center gap-2 text-sm text-zinc-500" role="group" aria-label="Language">
      <button type="button" data-lang="fr">FR</button><span aria-hidden="true">|</span><button type="button" data-lang="en">EN</button>
    </div>
    <button id="openModal" type="button" data-i18n="propose" class="shrink-0 rounded-full bg-white text-[#050505] text-sm font-medium px-4 py-2.5 hover:bg-violet-200 transition"></button>
  </div>
</header>

<main class="mx-auto max-w-7xl px-5">
  <!-- ============ HERO ============ -->
  <section class="pt-20 pb-12 sm:pt-28 text-center">
    <h1 data-i18n="heroTitle" class="text-4xl sm:text-6xl font-semibold tracking-tight text-white leading-[1.08] max-w-3xl mx-auto"></h1>
    <p data-i18n="heroSub" class="mt-6 text-base sm:text-lg text-zinc-400 font-light max-w-xl mx-auto leading-relaxed"></p>
    <div id="filters" class="scroll-mt-24 mt-10 flex flex-wrap justify-center gap-2.5" role="group"></div>
    <p id="count" class="mt-6 text-sm text-zinc-500" aria-live="polite"></p>
  </section>
  <!-- Section "En vedette" : emplacements sponsorisés, fixe en haut du catalogue -->
  <section id="featuredWrap" class="pb-10" aria-labelledby="fTitle">
    <h2 id="fTitle" data-i18n="featured" class="mb-4 text-sm font-medium text-amber-200/80"></h2>
    <div id="featured" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
  </section>
  <section id="grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3 pb-24"></section>
  <!-- État vide -->
  <div id="empty" class="hidden text-center pb-24 text-zinc-400">
    <div class="mx-auto h-14 w-14 rounded-2xl glass grid place-items-center text-zinc-500"><svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8.5 11h5"/></svg></div>
    <h3 data-i18n="emptyT" class="mt-5 font-semibold text-white"></h3>
    <p data-i18n="emptyS" class="mt-1.5 text-sm font-light"></p>
    <button id="reset" type="button" data-i18n="reset" class="mt-5 rounded-full border border-white/15 text-sm text-white px-5 py-2.5 hover:bg-white/10 transition"></button>
  </div>
<!-- Sponsoring : 3 formules, chacune pointe vers son lien Stripe Checkout -->
  <section id="sponsor" class="pb-24" aria-labelledby="spTitle">
    <div class="text-center max-w-xl mx-auto">
      <h2 id="spTitle" data-i18n="spTitle" class="text-3xl font-semibold text-white tracking-tight"></h2>
      <p data-i18n="spSub" class="mt-3 text-zinc-400 font-light"></p>
    </div>
    <div id="spCards" class="mt-10 grid gap-5 md:grid-cols-3 max-w-4xl mx-auto"></div>
  </section>
</main>
<footer class="border-t border-white/5 py-10 text-center text-sm text-zinc-600"><span data-i18n="footer"></span> <a href="#sponsor" data-i18n="spLink" class="underline underline-offset-4 hover:text-zinc-300 transition"></a></footer>

<!-- ============ MODALE "PROPOSER UN OUTIL" ============ -->
<div id="modal" class="fixed inset-0 z-50 grid place-items-center p-5 bg-black/60 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-hidden="true">
  <div id="panel" class="glass w-full max-w-md max-h-[90vh] overflow-y-auto rounded-2xl p-7 bg-[#0b0b10]/90">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 id="mTitle" data-i18n="mTitle" class="text-xl font-semibold text-white tracking-tight"></h2>
        <p data-i18n="mSub" class="mt-1.5 text-sm text-zinc-400 font-light"></p>
      </div>
      <button type="button" id="closeModal" aria-label="Close" class="text-zinc-500 hover:text-white transition text-2xl leading-none">&times;</button>
    </div>
    <form id="form" class="mt-6 space-y-4">
      <label class="block text-sm text-zinc-300"><span data-i18n="fName"></span>
        <input name="name" required data-ph="phName" class="field mt-1.5" autocomplete="off"></label>
      <label class="block text-sm text-zinc-300"><span data-i18n="fUrl"></span>
        <input name="url" type="url" required data-ph="phUrl" class="field mt-1.5"></label>
      <label class="block text-sm text-zinc-300"><span data-i18n="fModel"></span>
        <select name="model" class="field mt-1.5">
          <option value="free" data-i18n="mFree"></option><option value="freemium" data-i18n="mFreemium"></option><option value="paid" data-i18n="mPaid"></option>
        </select></label>
      <label class="block text-sm text-zinc-300"><span data-i18n="fEmail"></span>
        <input name="email" type="email" autocomplete="email" data-ph="phEmail" class="field mt-1.5"></label>
      <label class="flex items-start gap-3 text-sm text-zinc-300 cursor-pointer">
        <input type="checkbox" name="sponsored" class="mt-0.5 h-4 w-4 accent-violet-400">
        <span><span data-i18n="fSponsor"></span><span data-i18n="fSponsorHint" class="block text-xs text-zinc-500 font-light mt-0.5"></span></span></label>
      <!-- Grille tarifaire de la mise en avant (visible si la case est cochée) -->
      <fieldset id="plans" class="hidden"><legend data-i18n="pTitle" class="text-sm text-zinc-300"></legend>
        <div id="planList" class="mt-2 grid gap-2"></div>
        <p data-i18n="pNote" class="mt-2 text-xs text-zinc-500 font-light"></p></fieldset>
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none !important">   <!-- honeypot anti-spam Formspree -->
      <button type="submit" data-i18n="send" class="w-full rounded-full bg-white text-[#050505] text-sm font-medium py-3 hover:bg-violet-200 transition"></button>
    </form>
    <!-- Message de confirmation -->
    <div id="thanks" class="hidden text-center py-8">
      <div class="mx-auto h-12 w-12 rounded-full border border-emerald-400/40 bg-emerald-400/10 grid place-items-center text-emerald-300">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12 5 5 9-10"/></svg></div>
      <h3 data-i18n="thanksT" class="mt-5 text-lg font-semibold text-white"></h3>
      <p data-i18n="thanksS" class="mt-1.5 text-sm text-zinc-400 font-light"></p>
      <div id="payWrap" class="hidden mt-6"><a id="payLink" href="#" target="_blank" rel="noopener" class="inline-block rounded-full bg-white text-[#050505] text-sm font-medium px-5 py-2.5 hover:bg-violet-200 transition"></a></div>
      <button type="button" id="closeThanks" data-i18n="close" class="mt-6 inline-block rounded-full border border-white/10 text-sm text-zinc-300 px-6 py-2.5 hover:bg-white/10 transition"></button>
      
    </div>
  </div>
</div>

<div id="toast" class="toast fixed bottom-6 left-1/2 z-[60] glass rounded-full px-5 py-2.5 text-sm text-white bg-[#0b0b10]/90" role="status" aria-live="polite"></div>

<script>

   Helper T() : nom, modèle (free|freemium|trial|paid), catégorie, tags, URL (remplacer par vos liens d'affiliation),
   description FR, description EN. Le logo vient de l'API Google Favicon à partir de l'URL. */
/* Le 8e paramètre optionnel ajoute des champs (ex. added = date d'ajout pour le badge NEW) */
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

   tags, affiliate_link_placeholder (collez ici votre lien d'affiliation : il est prioritaire sur url), is_sponsored */
const T=(name,model,cat,tags,url,desc_fr,desc_en,x={})=>({id:slug(name),name,model,cat,category:cat.split(' ')[0],tags:tags.split(','),url,
  desc_fr,desc_en,description:desc_fr,icon_url:`https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=128`,
  affiliate_link_placeholder:'',is_sponsored:false,...x});

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const tagKey=g=>g.toLowerCase().replace(/\s+/g,'-');   // affichage : #sous-titres, #open-source…
const price=p=>lang==='fr'?String(p).replace('.',',')+' €':'€'+p;

/* Recherche tolérante : casse, accents, espaces, tirets et ponctuation ignorés.
   "cap cut", "cap-cut" et "cap" trouvent CapCut. Index précalculé une seule fois. */
const sq=s=>norm(s).replace(/[^a-z0-9]/g,'');
toolsData.forEach(t=>{t._k=sq([t.name,t.desc_fr,t.desc_en,t.tags.join(' ')].join(' '));t._t=t.tags.map(sq);});   // index texte + index des tags
function matches(t,q){
  /* #tags : casse, accents, tirets et espaces ignorés ("#Sous-titres" = "#sous titres" = "#soustitres") ; "#ia#montage" accepté */
  const hs=[...q.matchAll(/#([^\s#]*)/g)].map(m=>sq(m[1]));
  const toks=q.replace(/#[^\s#]*/g,' ').trim().split(/\s+/).map(sq).filter(Boolean);
  if(!hs.every(g=>t._t.some(x=>x.startsWith(g))))return false;   // chaque #tag doit correspondre à un tag de l'outil
  return !toks.length||t._k.includes(toks.join(''))||toks.every(w=>t._k.includes(w));
}

/* Scroll reveal (Intersection Observer). Les cartes masquées en display:none se révèlent à leur réapparition. */
const reveal=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const el=e.target;el.classList.add('is-visible');reveal.unobserve(el);setTimeout(()=>el.style.transitionDelay='',900);}}),
  {threshold:.12,rootMargin:'0px 0px -40px 0px'});

/* Repli du logo : monogramme si le favicon ne charge pas */
function logoFallback(img){const s=document.createElement('span');s.className='text-sm font-semibold text-zinc-300';
  s.textContent=img.alt.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();img.replaceWith(s);}

      <ul class="flex flex-wrap gap-1.5">${t.tags.map(g=>`<li><button type="button" data-act="tag" data-tag="${esc(tagKey(g))}" class="text-xs text-zinc-400 bg-white/5 border border-white/5 rounded-full px-2.5 py-1 hover:text-white hover:border-violet-400/50 hover:bg-violet-400/10 transition">#${esc(tagKey(g))}</button></li>`).join('')}</ul>
      <div class="flex items-center gap-2 shrink-0">
        <button type="button" data-act="share" data-i="${i}" title="${l.share}" aria-label="${l.share}" class="h-9 w-9 grid place-items-center rounded-full border border-white/10 text-zinc-400 hover:text-white hover:bg-white/10 transition"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
        <a data-a href="${esc(link)}" target="_blank" rel="noopener sponsored" aria-label="${l.access} ${esc(t.name)}" class="text-sm font-medium text-white bg-white/10 hover:bg-white hover:text-[#050505] border border-white/10 rounded-full px-4 py-2 transition">${l.access}</a>
      </div></div>
    <button type="button" data-act="report" data-i="${i}" class="mt-4 self-start text-xs text-zinc-600 hover:text-zinc-300 transition">${reported.has(t.name)?l.reported:l.report}</button>
  </article>`;
}

/* Construit le DOM UNE seule fois ; ensuite on bascule la classe 'hidden' (aucun innerHTML pendant la frappe) */
function buildGrid(){
  $('grid').innerHTML=toolsData.map((t,i)=>cardHTML(t,i,false)).join('');
  $('featured').innerHTML=featuredNames.map(n=>toolsData.findIndex(t=>t.name===n)).filter(i=>i>-1).map(i=>cardHTML(toolsData[i],i,true)).join('');
  cards=[...$('grid').children];
  document.querySelectorAll('.card').forEach((el,k)=>{el.style.transitionDelay=`${(k%3)*70}ms`;reveal.observe(el);});
}
/* Changement de langue : met à jour les textes en place, sans reconstruire */
function relabel(){
  const l=L();
  document.querySelectorAll('.card').forEach(el=>{
    const t=toolsData[el.dataset.i],q=x=>el.querySelector(x);
    q('[data-d]').textContent=t['desc_'+lang];q('[data-b]').textContent=l.badge[t.model];
    const a=q('[data-a]');a.textContent=l.access;a.setAttribute('aria-label',l.access+' '+t.name);
    const sh=q('[data-act=share]');sh.title=l.share;sh.setAttribute('aria-label',l.share);
    const sp=q('[data-s]');if(sp)sp.textContent=l.sponsored;
    q('[data-act=report]').textContent=reported.has(t.name)?l.reported:l.report;
  });
}
/* Filtre + recherche par masquage CSS */
function applyFilter(){
  const test=filters.find(f=>f[0]===active)[1];let n=0;
  cards.forEach((el,i)=>{const show=test(toolsData[i])&&matches(toolsData[i],query);el.classList.toggle('hidden',!show);if(show)n++;});
  $('empty').classList.toggle('hidden',n>0);
  $('count').textContent=`${n} ${n>1?L().many:L().one}`;
  $('featuredWrap').classList.toggle('hidden',!!query.trim()||!$('featured').children.length);   // vedettes masquées pendant une recherche
  document.querySelectorAll('#filters [data-id]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===active));
}
/* Filtres avec compteurs dynamiques, ex. « Stock Vidéo (12) » */
function renderFilters(){
  $('filters').innerHTML=filters.map(([id,fn])=>`<button type="button" data-id="${id}" aria-pressed="${id===active}" class="chip glass rounded-full px-4 py-2 text-sm text-zinc-300 hover:border-white/30">${L().f[id]} <span class="opacity-60">(${toolsData.filter(fn).length})</span></button>`).join('');
}
function renderPlans(){
  const l=L(),cur=(document.querySelector('[name=plan]:checked')||{}).value||90;
  /* Options de la modale */
  $('planList').innerHTML=plans.map(p=>`<label class="plan relative block"><input type="radio" name="plan" value="${p.d}"${p.d==cur?' checked':''}><div class="flex items-center justify-between text-sm"><span class="text-white">${p.n}<span class="block text-xs text-zinc-400">${p.d} ${l.pDays}${p.rec?', '+l.pRec:''}</span></span><span class="font-semibold text-white">${price(p.p)}</span></div></label>`).join('');
  /* Section tarifs : 3 cartes → liens Stripe Checkout */
  $('spCards').innerHTML=plans.map(p=>`<article class="glass rounded-2xl p-7 flex flex-col${p.rec?' featured':''}">
    <div class="flex items-center justify-between"><h3 class="font-semibold text-white">${p.n}</h3>${p.rec?`<span class="text-[10px] font-medium tracking-wide text-amber-300/90">${l.spRec}</span>`:''}</div>
    <p class="mt-5 text-4xl font-semibold text-white tracking-tight">${price(p.p)}</p>
    <p class="mt-1 text-sm text-zinc-400 font-light">${p.d} ${l.pDays}${p.d>30?', '+price(+(p.p/(p.d/30)).toFixed(1))+l.spPer:''}</p>
    <p class="mt-5 mb-7 text-sm text-zinc-300 font-light">${l.spFeat}</p>
    <button type="button" data-act="plan" data-plan="${p.d}" class="mt-auto text-center rounded-full border border-white/10 text-sm font-medium py-2.5 transition ${p.rec?'bg-white text-[#050505] hover:bg-violet-200':'bg-white/10 text-white hover:bg-white hover:text-[#050505]'}">${l.spCta} ${p.n}</button></article>`).join('');
}
function applyLang(){
  const l=L();
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=l[el.dataset.i18n]);
  document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=l[el.dataset.ph]);   // placeholders du formulaire inclus
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  renderFilters();renderPlans();setPay();cards.length?relabel():buildGrid();applyFilter();
}
document.querySelector('.lang').addEventListener('click',e=>{
  const b=e.target.closest('[data-lang]');if(!b||b.dataset.lang===lang)return;
  lang=b.dataset.lang;try{localStorage.setItem('cs-lang',lang);}catch(err){}
  applyLang();
});

/* ===================== 5) RECHERCHE, FILTRES, ACTIONS ===================== */
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;active=b.dataset.id;applyFilter();});
$('search').addEventListener('input',e=>{query=e.target.value;applyFilter();});
$('reset').addEventListener('click',()=>{query='';active='all';$('search').value='';applyFilter();$('search').focus();});

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
async function copy(text){
  try{await navigator.clipboard.writeText(text);}
  catch(e){const a=document.createElement('textarea');a.value=text;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(_){}a.remove();}
}
/* Partager / signaler (délégation d'événements, valable pour les cartes normales et vedettes) */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='tag'){   // clic sur un hashtag : filtre « Tous » + #tag dans la recherche
    active='all';query='#'+b.dataset.tag;$('search').value=query;applyFilter();
    $('filters').scrollIntoView({behavior:'smooth',block:'start'});return;
  }
  if(b.dataset.act==='plan'){openModal(+b.dataset.plan);return;}   // grille tarifaire : ouvre la modale
  const t=toolsData[+b.dataset.i];
  if(b.dataset.act==='share'){await copy(t.affiliate_link_placeholder||t.url);toast(L().copied);}
  if(b.dataset.act==='report'&&!reported.has(t.name)){
    const now=Date.now();
    if(now-lastReportTime<3000){toast(L().reportWait);return;}   // moins de 3 s depuis le dernier signalement : on bloque
    lastReportTime=now;
    reported.add(t.name);try{localStorage.setItem('cs-reported',JSON.stringify([...reported]));}catch(_){}
    post({_subject:'Creator Stack: lien mort signalé',type:'dead_link',tool:t.name,url:t.url,_gotcha:''}).catch(()=>{});   // envoi à Formspree
    document.querySelectorAll(`[data-act=report][data-i="${b.dataset.i}"]`).forEach(x=>x.textContent=L().reported);
    toast(L().reportToast);
  }
});

/* ===================== 6) MODALE & ACCESSIBILITÉ ===================== */
const modal=$('modal'),form=$('form');
const isOpen=()=>modal.classList.contains('open');
function openModal(planDays){
  lastFocus=document.activeElement;paidPlan=null;setPay();
  form.classList.remove('hidden');$('thanks').classList.add('hidden');
  if(planDays){   // depuis la grille tarifaire : Sponsorisé pré-coché + formule sélectionnée
    form.elements.sponsored.checked=true;$('plans').classList.remove('hidden');form.elements.email.required=true;
    const r=form.querySelector(`[name=plan][value="${planDays}"]`);if(r)r.checked=true;
  }
  modal.classList.add('open');modal.setAttribute('aria-hidden','false');
  setTimeout(()=>form.elements.name.focus(),120);
}
function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');if(lastFocus)lastFocus.focus();}   // le focus revient au bouton d'origine
function trapFocus(e){   // garde le focus clavier dans la modale
  const f=[...$('panel').querySelectorAll('button,input,select,a[href]')].filter(el=>!el.disabled&&el.offsetParent!==null);
  if(!f.length)return;const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}
$('openModal').addEventListener('click',()=>openModal());
$('closeModal').addEventListener('click',closeModal);
$('closeThanks').addEventListener('click',closeModal);
form.elements.sponsored.addEventListener('change',e=>{   // la mise en avant affiche les tarifs et rend l'email obligatoire
  $('plans').classList.toggle('hidden',!e.target.checked);form.elements.email.required=e.target.checked;
  if(e.target.checked&&!form.querySelector('[name=plan]:checked')){const r=form.querySelector('[name=plan]');if(r)r.checked=true;}   // aucune formule choisie : Starter par défaut
});
/* Envoi réel vers Formspree (POST JSON) : propositions d'outils, signalements */
let paidPlan=null;
function setPay(){   // bouton Stripe dynamique : « Procéder au paiement Stripe (Pro — 39 €) »
  $('payWrap').classList.toggle('hidden',!paidPlan);
  if(paidPlan){const a=$('payLink');a.textContent=`${L().pay} (${paidPlan.n} — ${price(paidPlan.p)})`;a.href=paidPlan.s;}
}
const FORMSPREE='https://formspree.io/f/mjykzqbn';
async function post(data){
  const r=await fetch(FORMSPREE,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)});
  if(!r.ok)throw new Error(r.status);
}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(form)),btn=form.querySelector('[type=submit]');
  d.sponsored=!!d.sponsored;
  const plan=d.sponsored?plans.find(x=>x.d==d.plan):null;
  if(plan){d.formule=plan.n;d.days=plan.d;d.price_eur=plan.p;}
  delete d.plan;d._subject='Creator Stack: nouvelle proposition d\'outil';
  if(d._gotcha)return;   // honeypot rempli : robot
  btn.disabled=true;
  try{await post(d);}catch(err){btn.disabled=false;toast(L().sendErr);return;}   // en cas d'échec, le formulaire reste rempli
  btn.disabled=false;form.reset();$('plans').classList.add('hidden');form.elements.email.required=false;
  paidPlan=plan;setPay();   // propose le paiement Stripe de la formule choisie
  form.classList.add('hidden');$('thanks').classList.remove('hidden');
});

/* Raccourcis : Ctrl/Cmd + K ou « / » → recherche ; Échap → ferme la modale ; Tab piégé dans la modale */
$('kbd').textContent=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)?'⌘ K':'Ctrl K';
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&isOpen())closeModal();
  else if(e.key==='Tab'&&isOpen())trapFocus(e);
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!isOpen()){$('search').focus();$('search').select();}}
  else if(e.key==='/'&&!isOpen()&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('search').focus();}
});

applyLang();   // initialisation
</script>
</body>
</html>
